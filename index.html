      h('div', null, h('b', { style: 'font-size:13px' }, '학습 목표'), h('ul', { class: 'goals' }, m.goals.map(g => h('li', null, g)))));
    main.append(head);
    const tabs = [['notes', '학습 정리', m.notes.length], ['examples', '예제 실습', m.examples.length], ['real', '실생활 예제', (m.real || []).length], ['tasks', '과제', m.tasks.length], ['quiz', '퀴즈', m.quiz.length], ['submit', '제출', null]];
    const tabBar = h('div', { class: 'tabs' });
    const panel = h('div', { class: 'card' });
    let current = tab || (ms.lastTab) || 'notes';
    const show = id => {
      current = id; ms.lastTab = id; save();
      tabBar.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
      panel.replaceChildren();
      ({ notes: renderNotes, examples: renderExamples, real: renderReal, tasks: renderTasks, quiz: renderQuiz, submit: renderSubmit })[id](m, panel);
    };
    for (const [id, label, cnt] of tabs) tabBar.append(h('button', { class: 'tab', type: 'button', 'data-id': id, onclick: () => show(id) }, label, cnt != null ? h('span', { class: 'cnt' }, cnt) : null));
    main.append(tabBar, panel);
    show(current);
  }

  function renderNotes(m, panel) {
    m.notes.forEach((n, i) => {
      const box = h('div', { class: 'note' }, h('h3', null, n.h), h('p', null, n.body));
      if (n.code) {
        const colab = n.code.startsWith('# Colab');
        if (colab) {
          box.append(h('div', { class: 'runner', style: 'margin-top:10px' }, h('div', { class: 'runner-top' }, h('span', { class: 'title' }, 'Colab에서 실행하는 코드 (참고)')), h('textarea', { class: 'code', readonly: 'readonly', style: 'min-height:80px' }, n.code)));
        } else {
          box.append(makeRunner({ title: '직접 실행해 보기', code: n.code, stdin: '' }));
        }
      }
      panel.append(box);
    });
  }

  function renderExamples(m, panel) {
    const ms = mstate(m.id);
    m.examples.forEach((ex, i) => {
      panel.append(h('div', { class: 'note' }, h('h3', null, `예제 ${i + 1}. ${ex.title}`),
        makeRunner({ title: '고쳐 보고 실행해 보세요', code: ex.code, stdin: ex.stdin || '', storageGet: () => ms.examples['e' + i], storageSet: v => { ms.examples['e' + i] = v === ex.code ? undefined : v; save(); } })));
    });
  }

  function renderReal(m, panel) {
    const ms = mstate(m.id);
    panel.append(h('p', { class: 'inline-note', style: 'margin-bottom:6px' }, '이번 주 개념이 실제 프로그램 어디에 쓰이는지 보고, 그 핵심 부분만 비워 둔 코드를 직접 채워 실행해 봅니다. ▼ 표시 사이에만 작성하면 됩니다.'));
    (m.real || []).forEach((r, i) => {
      const rs = ms.real[r.id] = ms.real[r.id] || {};
      const badge = h('span', { class: 'badge ' + (rs.pass ? 'pass' : rs.ran ? 'ran' : 'todo') }, rs.pass ? '통과' : rs.ran ? '실행함' : '미완성');
      const box = h('div', { class: 'task' },
        h('div', { class: 'task-head' }, h('h3', null, `사례 ${i + 1}. ${r.title}`), h('span', { class: 'pill' + (r.school ? ' ready' : '') }, (r.school ? '학교 현장 · ' : '') + r.where), badge),
        h('p', { class: 'desc' }, r.context),
        h('p', { class: 'desc', style: 'margin-top:6px' }, h('b', null, '채울 내용: '), r.task));
      let runner;
      const solBtn = h('button', { class: 'btn small ghost', type: 'button', title: '정답 코드를 편집기에 넣습니다' }, '정답 보기');
      runner = makeRunner({ title: '빈칸을 채워 실행', code: r.code, stdin: r.stdin || '', storageGet: () => rs.code, storageSet: v => { rs.code = v; save(); },
        extraButtons: [solBtn],
        onResult: res => {
          rs.ran = true; rs.pass = res.status === 'ok' && res.output.includes(r.check); rs.ranAt = new Date().toISOString(); rs.code = res.code;
          ms.updatedAt = rs.ranAt; save(); cloudSaveModule(m.id);
          badge.className = 'badge ' + (rs.pass ? 'pass' : 'ran'); badge.textContent = rs.pass ? '통과' : (res.status === 'ok' ? '실행함 — 기대 결과와 다름' : '오류 — 다시 시도');
        } });
      solBtn.addEventListener('click', () => {
        const ta = $('textarea.code', runner);
        if (solBtn.dataset.shown) { ta.value = rs.userCode || r.code; solBtn.textContent = '정답 보기'; delete solBtn.dataset.shown; }
        else { rs.userCode = ta.value; ta.value = r.solution; solBtn.textContent = '내 코드로'; solBtn.dataset.shown = '1'; }
        rs.code = ta.value; save(); ta.dispatchEvent(new Event('input'));
      });
      box.append(runner, h('p', { class: 'inline-note', style: 'margin-top:6px' }, `자가 확인: 실행 결과에 "${r.check}" 이(가) 포함되면 통과입니다.`));
      panel.append(box);
    });
  }

  function renderTasks(m, panel) {
    const ms = mstate(m.id);
    m.tasks.forEach((t, i) => {
      const ts = ms.tasks[t.id] = ms.tasks[t.id] || {};
      const badge = h('span', { class: 'badge ' + (ts.pass ? 'pass' : ts.ran ? 'ran' : 'todo') }, ts.pass ? '자가 확인 통과' : ts.ran ? '실행 기록됨' : '미실행');
      const box = h('div', { class: 'task' }, h('div', { class: 'task-head' }, h('h3', null, `과제 ${i + 1}. ${t.title}`), badge), h('p', { class: 'desc' }, t.desc));
      if (t.hints && t.hints.length) box.append(h('details', { class: 'hints' }, h('summary', null, `힌트 ${t.hints.length}개`), h('ul', null, t.hints.map(x => h('li', null, x)))));
      const runner = makeRunner({ title: '과제 코드', code: t.starter, stdin: ts.stdin != null ? ts.stdin : (t.stdin || ''), storageGet: () => ts.code, storageSet: v => { ts.code = v; save(); },
        onResult: r => {
          ts.ran = true; ts.status = r.status; ts.output = r.output.slice(0, 4000); ts.code = r.code; ts.charts = r.charts; ts.ranAt = new Date().toISOString();
          ts.stdin = $('.stdin', runner).value;
          ts.pass = !!(t.check && r.status === 'ok' && r.output.includes(t.check));
          ms.updatedAt = new Date().toISOString(); save(); cloudSaveModule(m.id);
          badge.className = 'badge ' + (ts.pass ? 'pass' : 'ran'); badge.textContent = ts.pass ? '자가 확인 통과' : (r.status === 'ok' ? '실행 기록됨' : '오류 — 다시 시도');
          renderNav(m.id);
        } });
      box.append(runner);
      if (t.check) box.append(h('p', { class: 'inline-note', style: 'margin-top:6px' }, `자가 확인: 실행 결과에 "${t.check}" 이(가) 포함되면 통과로 표시됩니다.`));
      const ref = h('textarea', { placeholder: '코드가 하는 일, 결과의 해석, 어려웠던 점과 해결 방법, 느낀 점을 적어 주세요.' });
      ref.value = ts.reflection || '';
      ref.addEventListener('input', () => { ts.reflection = ref.value; ms.updatedAt = new Date().toISOString(); save(); cloudSaveModule(m.id); });
      box.append(h('div', { class: 'reflect' }, h('label', null, '설명 / 성찰 (제출 파일에 포함)'), ref));
      panel.append(box);
    });
  }

  function renderQuiz(m, panel) {
    const ms = mstate(m.id);
    const graded = !!ms.quiz;
    const form = h('form', { onsubmit: e => e.preventDefault() });
    m.quiz.forEach((q, i) => {
      const box = h('div', { class: 'q' });
      box.append(h('div', { class: 'qt' }, h('span', { class: 'n' }, `Q${i + 1}.`), q.q));
      q.choices.forEach((c, k) => {
        const inp = h('input', { type: 'radio', name: `q${m.id}_${i}`, value: k, id: `q${m.id}_${i}_${k}` });
        if (ms.quizAnswers[i] === k) inp.checked = true;
        if (graded) inp.disabled = true;
        inp.addEventListener('change', () => { ms.quizAnswers[i] = k; save(); });
        const lab = h('label', { class: 'choice' + (graded ? (k === q.answer ? ' correct' : (ms.quizAnswers[i] === k ? ' wrong' : '')) : ''), for: inp.id }, inp, h('span', null, c));
        box.append(lab);
      });
      if (graded) box.append(h('div', { class: 'explain' }, (ms.quizAnswers[i] === q.answer ? '정답. ' : `오답 (정답: ${q.answer + 1}번). `) + q.explain));
      form.append(box);
    });
    const foot = h('div', { class: 'quiz-foot' });
    if (graded) {
      foot.append(h('span', { class: 'score' }, `${ms.quiz.score} / ${ms.quiz.total} `, h('small', null, `(${Math.round(ms.quiz.score / ms.quiz.total * 100)}점 · ${new Date(ms.quiz.at).toLocaleString('ko-KR')})`)),
        h('button', { class: 'btn', type: 'button', onclick: () => { ms.quiz = null; ms.quizAnswers = {}; ms.updatedAt = new Date().toISOString(); save(); cloudSaveModule(m.id); renderNav(m.id); panel.replaceChildren(); renderQuiz(m, panel); } }, '다시 풀기'));
    } else {
      const msg = h('span', { class: 'msg err' });
      foot.append(h('button', { class: 'btn primary', type: 'button', onclick: () => {
        const unanswered = m.quiz.map((_, i) => i).filter(i => ms.quizAnswers[i] == null);
        if (unanswered.length) { msg.textContent = `${unanswered.map(i => i + 1).join(', ')}번 문항에 답해 주세요.`; return; }
        const score = m.quiz.filter((q, i) => ms.quizAnswers[i] === q.answer).length;
        ms.quiz = { score, total: m.quiz.length, at: new Date().toISOString(), answers: m.quiz.map((q, i) => ({ chosen: ms.quizAnswers[i], correct: q.answer })) };
        ms.updatedAt = new Date().toISOString(); save(); cloudSaveModule(m.id); renderNav(m.id); panel.replaceChildren(); renderQuiz(m, panel);
      } }, '채점하기'), msg);
    }
    form.append(foot);
    panel.append(form);
  }

  function renderSubmit(m, panel) {
    const ms = mstate(m.id);
    const tasksRan = m.tasks.filter(t => ms.tasks[t.id] && ms.tasks[t.id].ran);
    const tasksReflected = m.tasks.filter(t => ms.tasks[t.id] && (ms.tasks[t.id].reflection || '').trim().length >= 20);
    panel.append(h('h3', null, `${m.week}주차 제출`),
      h('p', { class: 'inline-note' }, '"제출하기"를 누르면 퀴즈 결과, 과제 코드·실행 결과·성찰이 교수자에게 전달됩니다. 제출 파일(.md)은 개인 보관용입니다.'),
      h('div', { class: 'submit-grid' },
        h('div', { class: 'stat' }, h('div', { class: 'k' }, '퀴즈'), h('div', { class: 'v' }, ms.quiz ? `${ms.quiz.score}/${ms.quiz.total}` : '—', h('small', null, ms.quiz ? ` ${Math.round(ms.quiz.score / ms.quiz.total * 100)}점` : ' 미응시'))),
        h('div', { class: 'stat' }, h('div', { class: 'k' }, '과제 실행'), h('div', { class: 'v' }, `${tasksRan.length}/${m.tasks.length}`)),
        h('div', { class: 'stat' }, h('div', { class: 'k' }, '성찰 작성(20자 이상)'), h('div', { class: 'v' }, `${tasksReflected.length}/${m.tasks.length}`))));
    const list = h('ul', { class: 'checklist' },
      h('li', { class: 'done' }, `이름: ${state.name} · 학번: ${state.org}`),
      h('li', { class: ms.quiz ? 'done' : 'todo' }, ms.quiz ? '퀴즈 채점 완료' : '퀴즈를 풀고 채점하세요'),
      h('li', { class: (m.real || []).every(r => ms.real[r.id] && ms.real[r.id].pass) ? 'done' : 'todo' }, `실생활 예제 통과 ${(m.real || []).filter(r => ms.real[r.id] && ms.real[r.id].pass).length}/${(m.real || []).length} (선택)`),
      ...m.tasks.map((t, i) => { const ts = ms.tasks[t.id] || {}; return h('li', { class: ts.ran ? 'done' : 'todo' }, `과제 ${i + 1} ${ts.ran ? '실행 기록됨' + (ts.pass ? ' (자가 확인 통과)' : '') : '실행 기록 없음'}${(ts.reflection || '').trim() ? ' · 성찰 작성됨' : ' · 성찰 미작성'}`); }));
    panel.append(list);
    const msg = h('div', { class: 'msg muted' });
    const btnRow = h('div', { style: 'margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center' });
    const ready = ms.quiz && tasksRan.length === m.tasks.length;
    if (cloud.enabled) {
      btnRow.append(h('button', { class: 'btn primary', type: 'button', onclick: async () => {
        msg.className = 'msg muted'; msg.textContent = '제출 중…';
        ms.submittedAt = new Date().toISOString(); ms.updatedAt = ms.submittedAt; save();
        const ok = await cloudWriteDoc(cloud.db.doc('submissions/' + cloud.sid + '/modules/' + m.id), moduleDoc(m.id));
        if (ok) { await cloudSaveProfile(m.id); msg.className = 'msg ok'; msg.textContent = `제출되었습니다 (${new Date(ms.submittedAt).toLocaleString('ko-KR')}). 이후 수정하고 다시 제출할 수도 있습니다.`; }
        else { msg.className = 'msg err'; msg.textContent = '서버 제출에 실패했습니다. 잠시 후 다시 시도하거나 제출 파일을 내려받아 보관하세요.'; }
      } }, ms.submittedAt ? '다시 제출하기' : '제출하기'));
    }
    btnRow.append(h('button', { class: 'btn', type: 'button', onclick: () => { downloadFile(`W${String(m.week).padStart(2, '0')}_${fileTag()}_제출.md`, buildSubmission(m), msg, panel); } }, '제출 파일 내려받기 (.md, 보관용)'));
    btnRow.append(h('button', { class: 'btn', type: 'button', onclick: () => { const pv = $('.preview-sub', panel); if (pv) { pv.classList.toggle('hidden'); $('textarea', pv).value = buildSubmission(m); } } }, '미리보기'));
    if (!ready) btnRow.append(h('span', { class: 'inline-note' }, '아직 완료되지 않은 항목이 있어도 제출할 수 있습니다(중간 제출).'));
    panel.append(btnRow, msg, h('div', { class: 'fallback preview-sub hidden' }, h('textarea', { readonly: 'readonly', 'aria-label': '제출 미리보기' })));
    panel.append(h('p', { class: 'inline-note', style: 'margin-top:8px' }, (ms.submittedAt ? `마지막 제출: ${new Date(ms.submittedAt).toLocaleString('ko-KR')} · ` : '아직 제출하지 않았습니다. ') + '작성 중인 내용은 서버에 자동 저장됩니다.'));
    if (ms.feedback || ms.grade != null) {
      panel.append(h('div', { class: 'explain', style: 'margin-top:14px' }, h('b', null, '교수자 피드백' + (ms.grade != null ? ` · 점수 ${ms.grade}` : '') + (ms.feedbackAt ? ` (${new Date(ms.feedbackAt).toLocaleString('ko-KR')})` : '')), h('div', { style: 'white-space:pre-wrap;margin-top:4px;color:var(--fg)' }, ms.feedback || '')));
    }
  }

  function buildSubmission(m) {
    const ms = mstate(m.id);
    const now = new Date();
    const L = [];
    L.push(`# [프로그래밍교수학습] ${m.week}주차 제출 — ${m.title}`);
    L.push('');
    L.push(`- 이름: ${state.name || '(미입력)'}`);
    L.push(`- 학번: ${state.org || '(미입력)'}`);
    L.push(`- 제출 시각: ${now.toLocaleString('ko-KR')}`);
    L.push('');
    L.push('## 퀴즈');
    if (ms.quiz) {
      L.push(`점수: ${ms.quiz.score} / ${ms.quiz.total} (${Math.round(ms.quiz.score / ms.quiz.total * 100)}점) · 채점 ${new Date(ms.quiz.at).toLocaleString('ko-KR')}`);
      L.push('');
      m.quiz.forEach((q, i) => {
        const a = ms.quiz.answers[i] || {};
        L.push(`${i + 1}. ${q.q.split('\n')[0]}`);
        L.push(`   - 선택: ${a.chosen != null ? (a.chosen + 1) + '번 ' + q.choices[a.chosen] : '(무응답)'} → ${a.chosen === q.answer ? '정답' : '오답 (정답 ' + (q.answer + 1) + '번)'}`);
      });
    } else L.push('미응시');
    L.push('');
    L.push('## 실생활 예제');
    L.push((m.real || []).map((r, i) => { const rs = ms.real[r.id] || {}; return `${i + 1}. ${r.title} — ${rs.pass ? '통과' : rs.ran ? '실행함' : '미완성'}`; }).join('\n') || '(없음)');
    L.push('');
    L.push('## 과제');
    m.tasks.forEach((t, i) => {
      const ts = ms.tasks[t.id] || {};
      L.push('');
      L.push(`### 과제 ${i + 1}. ${t.title}`);
      L.push(`상태: ${ts.ran ? (ts.status === 'ok' ? '실행 완료' : '실행 중 오류') + (ts.pass ? ' · 자가 확인 통과' : '') + (ts.ranAt ? ' · ' + new Date(ts.ranAt).toLocaleString('ko-KR') : '') : '실행 기록 없음'}`);
      L.push('');
      L.push('설명/성찰:');
      L.push((ts.reflection || '').trim() || '(작성하지 않음)');
      L.push('');
      L.push('```python');
      L.push((ts.code != null ? ts.code : t.starter).replace(/```/g, "'''"));
      L.push('```');
      if (ts.stdin) { L.push(''); L.push('입력값(input): ' + ts.stdin.split('\n').join(' / ')); }
      L.push('');
      L.push('실행 결과:');
      L.push('```');
      L.push((ts.output || '(없음)').replace(/```/g, "'''") + (ts.charts ? `\n[차트 ${ts.charts}개 출력됨]` : ''));
      L.push('```');
    });
    L.push('');
    L.push('## 기계 판독용 데이터');
    L.push('```json');
    L.push(JSON.stringify({ app: 'pel-lab', module: m.id, week: m.week, name: state.name, org: state.org, submittedAt: now.toISOString(), quiz: ms.quiz, tasks: m.tasks.map(t => { const ts = ms.tasks[t.id] || {}; return { id: t.id, ran: !!ts.ran, status: ts.status || null, pass: !!ts.pass, reflectionChars: (ts.reflection || '').trim().length, ranAt: ts.ranAt || null }; }) }));
    L.push('```');
    return L.join('\n') + '\n';
  }

  // ───────── 시작 ─────────
  $('#main').append(h('div', { class: 'card' }, h('p', { class: 'inline-note' }, '서버에 연결하는 중…')));
  $('.sidebar').classList.add('hidden');
  cloudInit();
  window.addEventListener('hashchange', () => { if (!cloud.authed) return; const id = (location.hash || '').replace('#', ''); if (COURSE.some(m => m.id === id)) go(id); else if ((id === 'teacher' || id === 'answers') && cloud.isOwner) go(id); else if (!id) go('home'); });
  if (document.readyState === 'complete') bootPython(); else window.addEventListener('load', bootPython);
})();
</script>

</body>
